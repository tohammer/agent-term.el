name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["28.2", "30.2", "31.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Install dependencies
        run: |
          emacs -Q --batch --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (package-initialize)
            (package-refresh-contents)
            (package-install 'transient)
            (package-install 'ghostel))"
      - name: Download the ghostel native module
        # Without it the session tests are skipped.
        run: |
          emacs -Q --batch --eval "(progn
            (package-initialize)
            (require 'ghostel)
            (unless (ghostel--download-module (ghostel--module-directory))
              (message \"ghostel module not available; session tests will be skipped\")))"
      - name: Compile, checkdoc, test
        run: make all
